<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" dir="rtl">
<head>
  <title>تفاصيل الموعد</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }
    .container {
      text-align: right;
    }
    .btn {
      margin-right: 0;
      margin-left: 5px;
    }
    .card {
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 8px;
    }
    .card-header {
      background-color: #f8f9fa;
      border-bottom: 1px solid #eee;
      font-weight: bold;
    }
    .info-group {
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }
    .info-group:last-child {
      border-bottom: none;
    }
    .info-label {
      font-weight: bold;
      color: #555;
    }
    .info-value {
      color: #333;
    }
  </style>
</head>
<body>
<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <a th:href="@{/Client/Dashboard}" class="btn btn-outline-secondary">
      <i class="fas fa-arrow-right ml-2"></i>العودة إلى القائمة
    </a>
    <h2><i class="fas fa-calendar-check ml-2"></i>تفاصيل الموعد</h2>
  </div>

  <div class="card mb-4">
    <div class="card-header">
      <h5 class="mb-0"><i class="fas fa-info-circle ml-2"></i>معلومات الموعد</h5>
    </div>
    <div class="card-body">
      <div class="row">
        <div class="col-md-6">
          <div class="info-group">
            <div class="info-label">الرقم التعريفي:</div>
            <div class="info-value" th:text="${rdv.id}"></div>
          </div>

          <div class="info-group">
            <div class="info-label">التاريخ:</div>
            <div class="info-value" th:text="${#temporals.format(rdv.date, 'dd/MM/yyyy')}"></div>
          </div>

          <div class="info-group">
            <div class="info-label">الساعة:</div>
            <div class="info-value" th:text="${rdv.heur}"></div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="info-group">
            <div class="info-label">الموضوع:</div>
            <div class="info-value" th:text="${rdv.sujet}"></div>
          </div>

          <div class="info-group">
            <div class="info-label">المحامي:</div>
            <div class="info-value" th:text="${rdv.avocat != null ? rdv.avocat.getLastName() + ' ' + rdv.avocat.getFirstName() : 'غير محدد'}"></div>
          </div>

          <div class="info-group">
            <div class="info-label">المكتب:</div>
            <div class="info-value" th:text="${rdv.bureau != null ? rdv.bureau.getNom() : 'غير محدد'}"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-center mt-4">
    <a th:href="@{/Client/rdv/edit/{id}(id=${rdv.id})}" class="btn btn-warning mx-2">
      <i class="fas fa-edit ml-2"></i>تعديل الموعد
    </a>

    <!-- Ajoutez ce bouton dans votre page de détails de rendez-vous -->
    <a th:href="@{/Client/rdv/print/{id}(id=${rdv.id})}" class="btn btn-info">
      <i class="fas fa-print ml-2"></i>طباعة الموعد
    </a>
    <a th:href="@{/Client/Dashboard}" class="btn btn-danger mx-2"
       onclick="return confirm('هل أنت متأكد من رغبتك في إلغاء هذا الموعد؟')">
      <i class="fas fa-times-circle ml-2"></i>إلغاء الموعد
    </a>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
  // Importer la police arabe Cairo de Google Fonts
  (function() {
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap';
    document.head.appendChild(link);
  })();
</script>
</body>
</html>
