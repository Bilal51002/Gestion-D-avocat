<!DOCTYPE html>
<html lang="ar" dir="rtl" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء ملف جديد</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');

    :root {
      --primary-color: #2c3e50;
      --secondary-color: #34495e;
      --accent-color: #3498db;
      --light-accent: #e0f7fa;
      --success-color: #2ecc71;
      --warning-color: #f39c12;
      --danger-color: #e74c3c;
      --text-color: #444444;
      --light-text: #95a5a6;
      --background-color: #ecf0f1;
      --card-bg: #ffffff;
      --border-radius: 8px;
      --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      --transition: all 0.3s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Cairo', sans-serif;
    }

    body {
      background-color: var(--background-color);
      color: var(--text-color);
      line-height: 1.6;
      direction: rtl;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    /* Header */
    header {
      background-color: var(--primary-color);
      padding: 20px;
      border-radius: var(--border-radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      color: white;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background-color: var(--accent-color);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
    }

    .user-details {
      color: white;
    }

    .user-name {
      font-weight: 600;
    }

    .user-email {
      font-size: 12px;
      color: #bdc3c7;
    }

    .logout-btn {
      background-color: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      border-radius: var(--border-radius);
      padding: 8px 15px;
      cursor: pointer;
      transition: var(--transition);
    }

    .logout-btn:hover {
      background-color: rgba(255, 255, 255, 0.3);
    }

    /* Page title */
    .page-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 30px;
      color: var(--text-color);
      position: relative;
      padding-right: 15px;
    }

    .page-title::before {
      content: '';
      position: absolute;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 5px;
      height: 25px;
      background-color: var(--accent-color);
      border-radius: 3px;
    }

    /* Form Styling */
    .card {
      background-color: var(--card-bg);
      border-radius: var(--border-radius);
      box-shadow: var(--box-shadow);
      overflow: hidden;
      margin-bottom: 30px;
    }

    .card-header {
      padding: 15px 20px;
      background-color: var(--primary-color);
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-title {
      font-weight: 600;
    }

    .card-icon {
      font-size: 24px;
    }

    .card-content {
      padding: 20px;
    }

    .form-info {
      background-color: var(--light-accent);
      border-radius: var(--border-radius);
      padding: 15px;
      margin-bottom: 25px;
      border-right: 4px solid var(--accent-color);
      color: var(--text-color);
    }

    .form-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
    }

    .form-col {
      flex: 1;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-color);
    }

    .required-field::after {
      content: ' *';
      color: var(--danger-color);
    }

    .form-control, .form-select {
      width: 100%;
      padding: 10px 15px;
      border: 1px solid #ddd;
      border-radius: var(--border-radius);
      font-size: 16px;
      transition: var(--transition);
    }

    .form-control:focus, .form-select:focus {
      border-color: var(--accent-color);
      outline: none;
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
    }

    /* Styling pour Select2 */
    .select2-container {
      width: 100% !important;
    }

    .select2-container--default .select2-selection--multiple {
      border: 1px solid #ddd;
      border-radius: var(--border-radius);
    }

    .select2-container--default.select2-container--focus .select2-selection--multiple {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.2);
    }

    .select2-container--default .select2-selection--multiple .select2-selection__choice {
      background-color: var(--light-accent);
      border: 1px solid var(--accent-color);
      border-radius: 4px;
      color: var(--text-color);
    }

    /* Buttons */
    .btn {
      padding: 10px 20px;
      border-radius: var(--border-radius);
      border: none;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      transition: var(--transition);
    }

    .btn-primary {
      background-color: var(--accent-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: #2980b9;
    }

    .btn-outline {
      background-color: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
    }

    .btn-outline:hover {
      background-color: var(--accent-color);
      color: white;
    }

    .form-actions {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    /* Alerts */
    .alert {
      padding: 15px;
      border-radius: var(--border-radius);
      margin-bottom: 20px;
    }

    .alert-danger {
      background-color: #fde9e7;
      color: var(--danger-color);
      border-right: 4px solid var(--danger-color);
    }

    .alert-success {
      background-color: #e6f7ee;
      color: var(--success-color);
      border-right: 4px solid var(--success-color);
    }

    .text-muted {
      color: var(--light-text);
      font-size: 14px;
      margin-top: 5px;
    }

    @media (max-width: 768px) {
      .form-row {
        flex-direction: column;
        gap: 0;
      }

      .form-actions {
        flex-direction: column;
        gap: 15px;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">المساعد القانوني</div>
    <div class="user-info">
      <div class="user-avatar" th:text="${avocat.getFirstName().substring(0,1)}">م</div>
      <div class="user-details">
        <div class="user-name" th:text="${'الأستاذ ' + avocat.getFirstName() + ' ' + avocat.getLastName()}">الأستاذ محمد العلوي</div>
        <div class="user-email" th:text="${avocat.getEmail()}">m.alaoui@cabinet.ma</div>
      </div>
      <a class="logout-btn" th:href="@{/logout}">تسجيل الخروج</a>
    </div>
  </header>

  <h1 class="page-title">إنشاء ملف جديد</h1>

  <div class="card">
    <div class="card-header">
      <div class="card-title">معلومات الملف</div>
      <div class="card-icon">📁</div>
    </div>
    <div class="card-content">
      <div class="form-info">
        <p>يرجى ملء جميع المعلومات المطلوبة لإنشاء ملف جديد. الحقول المميزة بعلامة (*) إلزامية.</p>
      </div>

      <!-- Messages d'erreur et de succès -->
      <div th:if="${param.error}" class="alert alert-danger">
        <p th:text="${param.error == 'numeroNationalDuplique'} ? 'الرقم الوطني موجود بالفعل. الرجاء استخدام رقم آخر.' : 'حدث خطأ أثناء إنشاء الملف. يرجى المحاولة مرة أخرى.'"></p>
      </div>

      <div th:if="${errorMessage}" class="alert alert-danger">
        <p th:text="${errorMessage}"></p>
      </div>

      <div th:if="${successMessage}" class="alert alert-success">
        <p th:text="${successMessage}"></p>
      </div>

      <form th:action="@{/Avocat/dossier/create}" th:object="${dossier}" method="post" id="createDossierForm">
        <div class="form-row">
          <div class="form-col">
            <div class="form-group">
              <label for="typeD" class="form-label required-field">نوع الملف</label>
              <select id="typeD" th:field="*{typeD}" class="form-select" required>
                <option value="">-- اختر نوع الملف --</option>
                <option th:each="type : ${typeDossiers}"
                        th:value="${type.id}"
                        th:text="${type.nom}">نوع الملف</option>
              </select>
            </div>
          </div>
          <div class="form-col">
            <div class="form-group">
              <label for="typeDecas" class="form-label">حالة الملف</label>
              <select id="typeDecas" th:field="*{typeDecas}" class="form-select">
                <option value="">-- اختر حالة الملف --</option>
                <option value="قيد التنفيذ">قيد التنفيذ</option>
                <option value="مكتمل">مكتمل</option>
                <option value="معلق">معلق</option>
                <option value="مرفوض">مرفوض</option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="sujet" class="form-label required-field">موضوع الملف</label>
          <input type="text" id="sujet" th:field="*{sujet}" class="form-control" required>
        </div>

        <div class="form-group">
          <label for="typeProsedure" class="form-label">نوع الإجراء</label>
          <input type="text" id="typeProsedure" th:field="*{typeProsedure}" class="form-control">
        </div>

        <div class="form-row">
          <div class="form-col">
            <div class="form-group">
              <label for="clients" class="form-label required-field">العملاء</label>
              <select id="clients" name="clientIds" class="form-select select2-multiple" multiple required>
                <option th:each="client : ${clients}"
                        th:value="${client.id}"
                        th:text="${client.firstName + ' ' + client.lastName}">
                  اسم العميل
                </option>
              </select>
              <small class="text-muted">اختر عميلاً واحدًا على الأقل</small>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <div class="form-group">
              <label for="tribunal" class="form-label">المحكمة</label>
              <select id="tribunal" name="tribunalIds" class="form-select select2-multiple" multiple>
                <option th:each="tribunal : ${tribunaux}"
                        th:value="${tribunal.id}"
                        th:text="${tribunal.nom}">
                  اسم المحكمة
                </option>
              </select>
            </div>
          </div>
          <div class="form-col">
            <div class="form-group">
              <label for="juges" class="form-label">القضاة</label>
              <select id="juges" name="jugeIds" class="form-select select2-multiple" multiple>
                <option th:each="juge : ${juges}"
                        th:value="${juge.id}"
                        th:text="${juge.nom + ' ' + juge.prenom}">
                  اسم القاضي
                </option>
              </select>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="form-col">
            <div class="form-group">
              <label for="numeroNational" class="form-label">الرقم الوطني للملف</label>
              <input type="text" id="numeroNational" th:field="*{numeroNational}" class="form-control">
              <small class="text-muted">يجب أن يكون الرقم الوطني فريدًا</small>
            </div>
          </div>
          <div class="form-col">
            <div class="form-group">
              <label for="dateProchSession" class="form-label">تاريخ الجلسة المقبلة</label>
              <input type="date" id="dateProchSession" th:field="*{dateProchSession}" class="form-control">
            </div>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">إنشاء الملف</button>
          <a th:href="@{/Avocat/Dashboard}" class="btn btn-outline">إلغاء</a>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
<script>
  $(document).ready(function() {
    // Initialiser les sélecteurs multiples avec Select2
    $('.select2-multiple').select2({
      dir: "rtl",
      language: "ar",
      placeholder: "اختر من القائمة",
      allowClear: true
    });

    // Validation du formulaire côté client
    $('#createDossierForm').on('submit', function(e) {
      // Vérifier que les champs requis sont remplis
      if (!$('#typeD').val()) {
        alert('يرجى اختيار نوع الملف');
        e.preventDefault();
        return false;
      }

      if (!$('#sujet').val()) {
        alert('يرجى إدخال موضوع الملف');
        e.preventDefault();
        return false;
      }

      // Vérifier qu'au moins un client est sélectionné
      if ($('#clients').val() == null || $('#clients').val().length === 0) {
        alert('يرجى اختيار عميل واحد على الأقل');
        e.preventDefault();
        return false;
      }

      // Désactiver le bouton de soumission et montrer un indicateur de chargement
      $('#submitBtn').prop('disabled', true).html('<i class="fas fa-spinner fa-spin"></i> جاري المعالجة...');

      return true;
    });
  });
</script>
</body>
</html>
