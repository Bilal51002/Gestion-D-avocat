<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Accepter le Rendez-vous</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css">
    <style>
        .card {
            max-width: 500px;
            margin: 20px auto;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .header {
            background-color: #f8f9fa;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }
        .success-message {
            color: #28a745;
            font-weight: bold;
        }
        .error-message {
            color: #dc3545;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container mt-4">
    <div class="card">
        <div class="header">
            <h3>Confirmation de Rendez-vous</h3>
        </div>
        <div class="card-body">
            <div th:if="${param.success}" class="alert alert-success">
                <p class="success-message">Le rendez-vous a été accepté avec succès.</p>
            </div>
            <div th:if="${param.error}" class="alert alert-danger">
                <p class="error-message" th:text="${param.message}">Une erreur est survenue.</p>
            </div>

            <div th:if="${rdv != null}" class="rdv-details">
                <h4>Détails du Rendez-vous</h4>
<!--                <p><strong>ID:</strong> <span th:text="${rdv.id}">30</span></p>-->
<!--                <p><strong>Patient:</strong> <span th:text="${rdv.patient.nom} + ' ' + ${rdv.patient.prenom}">Nom du patient</span></p>-->
<!--                <p><strong>Date:</strong> <span th:text="${#temporals.format(rdv.dateHeure, 'dd/MM/yyyy HH:mm')}">01/05/2025 14:30</span></p>-->
<!--                <p><strong>Motif:</strong> <span th:text="${rdv.motif}">Consultation</span></p>-->
<!--                <p><strong>Statut actuel:</strong> <span th:text="${rdv.statut}">EN_ATTENTE</span></p>-->

<!--                <form th:if="${rdv.statut.name() == 'EN_ATTENTE'}" th:action="@{/Secretaire/rdv/accepter/{id}(id=${rdv.id})}" method="post" class="mt-3">-->
<!--                    <button type="submit" class="btn btn-success">Accepter ce rendez-vous</button>-->
<!--                </form>-->
                <div th:if="${rdv.statut.name() == 'ACCEPTE'}" class="mt-3">
                    <p class="success-message">Ce rendez-vous a déjà été accepté.</p>
                </div>
            </div>

            <div class="mt-3">
                <a href="/Secretaire/notifications" class="btn btn-secondary">Retour aux notifications</a>
            </div>
        </div>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
