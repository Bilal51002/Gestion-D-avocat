<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" dir="rtl">
<head>
  <title>تفاصيل الموعد</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <style>
    body {
      font-family: 'Cairo', sans-serif;
    }
    .container {
      text-align: right;
    }
    .btn {
      margin-right: 0;
      margin-left: 5px;
    }
  </style>
</head>
<body>
<div class="container mt-5">
  <h2>تفاصيل الموعد</h2>

  <div class="card">
    <div class="card-body">
      <p><strong>الرقم التعريفي:</strong> <span th:text="${rdv.id}"></span></p>
<!--      <p><strong>التاريخ:</strong> <span th:text="${#dates.format(rdv.date, 'dd/MM/yyyy')}"></span></p>-->
      <p><strong>التاريخ:</strong> <span th:text="${#temporals.format(rdv.date, 'dd/MM/yyyy')}"></span></p>
      <p><strong>الوقت:</strong> <span th:text="${rdv.heur}"></span></p>
      <p><strong>الموضوع:</strong> <span th:text="${rdv.sujet}"></span></p>
      <p><strong>رقم العميل:</strong> <span th:text="${rdv.client != null ? rdv.client.id : 'غير محدد'}"></span></p>
      <p><strong>رقم المكتب:</strong> <span th:text="${rdv.bureau != null ? rdv.bureau.id : 'غير محدد'}"></span></p>
    </div>
  </div>

  <div class="mt-3">
    <a th:href="@{/Secretaire/rdv/edit/{id}(id=${rdv.id})}" class="btn btn-warning">تعديل</a>
    <a th:href="@{/Secretaire/rdv/delete/{id}(id=${rdv.id})}" class="btn btn-danger"
       onclick="return confirm('هل أنت متأكد من رغبتك في حذف هذا الموعد؟')">حذف</a>
    <a th:href="@{/Secretaire/rdv/list}" class="btn btn-secondary">العودة إلى القائمة</a>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
  // Importer la police arabe Cairo de Google Fonts
  (function() {
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap';
    document.head.appendChild(link);
  })();
</script>
</body>
</html>
