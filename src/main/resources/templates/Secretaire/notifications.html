<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإشعارات - مكتب المحاماة</title>
    <!-- Bootstrap RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.1/css/all.css">
    <!-- Google Font: Cairo - Excellent Arabic font -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }

        .sidebar {
            background-color: #2c3e50;
            min-height: 100vh;
            color: white;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            position: fixed;
            width: inherit;
            z-index: 100;
        }
        .sidebar-header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            background-color: #1a2530;
        }
        .sidebar-header h4 {
            margin: 0;
            font-weight: 700;
            color: #ecf0f1;
        }
        .sidebar-header p {
            margin: 10px 0 0;
            opacity: 0.8;
            font-size: 14px;
        }
        .sidebar ul {
            padding: 20px 0;
            margin: 0;
        }
        .sidebar ul li {
            list-style: none;
            padding: 0;
        }
        .sidebar ul li a {
            color: #ecf0f1;
            text-decoration: none;
            transition: all 0.3s;
            display: block;
            padding: 15px 20px;
            border-right: 4px solid transparent;
            font-size: 16px;
            font-weight: 500;
        }
        .sidebar ul li a i {
            margin-left: 10px;
            width: 20px;
            text-align: center;
        }
        .sidebar ul li a:hover {
            background-color: rgba(255,255,255,0.1);
            border-right-color: #3498db;
        }
        .sidebar ul li.active a {
            background-color: rgba(255,255,255,0.15);
            color: #fff;
            border-right-color: #3498db;
            font-weight: 600;
        }

        /* Main Content */
        .main-content {
            margin-right: 2%;
            padding: 30px;
        }
        .page-title {
            margin-bottom: 30px;
            position: relative;
            padding-bottom: 15px;
        }
        .page-title:after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 60px;
            height: 3px;
            background-color: #3498db;
        }

        /* Notification Styles */
        .notifications-container {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
            overflow: hidden;
        }
        .notifications-header {
            background-color: #3498db;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .notifications-header h5 {
            margin: 0;
            font-weight: 600;
        }
        .btn-mark-all-read {
            background-color: white;
            color: #3498db;
            border: none;
            border-radius: 5px;
            padding: 8px 15px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-mark-all-read:hover {
            background-color: #f8f9fa;
            transform: translateY(-2px);
        }

        .notification-item {
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
            transition: background-color 0.3s;
            position: relative;
        }
        .notification-item:hover {
            background-color: #f9f9f9;
        }
        .notification-item.unread {
            border-right: 4px solid #3498db;
            background-color: #f0f7ff;
        }
        .notification-item.read {
            border-right: 4px solid transparent;
        }
        .notification-content {
            text-decoration: none;
            color: inherit;
            display: block;
            cursor: pointer;
        }
        .notification-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        .notification-title {
            font-weight: bold;
            font-size: 16px;
            color: #2c3e50;
        }
        .notification-date {
            color: #7f8c8d;
            font-size: 14px;
        }
        .notification-message {
            color: #555;
            margin-bottom: 15px;
        }

        /* Action Buttons */
        .rdv-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-start;
            margin-top: 10px;
        }
        .btn-action {
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            border: none;
            transition: all 0.3s;
        }
        .btn-details {
            background-color: #3498db;
            color: white;
        }
        .btn-accept {
            background-color: #2ecc71;
            color: white;
        }
        .btn-reject {
            background-color: #e74c3c;
            color: white;
        }
        .btn-action:hover {
            transform: translateY(-2px);
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }

        /* Empty State */
        .empty-state {
            padding: 40px;
            text-align: center;
            color: #7f8c8d;
        }
        .empty-state i {
            font-size: 3em;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* Responsive */
        @media (max-width: 991.98px) {
            .sidebar {
                position: static;
                min-height: auto;
            }
            .main-content {
                margin-right: 0;
            }
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-lg-2 p-0">
            <div class="sidebar">
                <div class="sidebar-header">
                    <h4>مكتب المحاماة</h4>
                    <p th:text="${secretaire != null ? secretaire.firstName + ' ' + secretaire.lastName : ''}"></p>
                </div>
                <ul>
                    <li class="active"><a th:href="@{/Secretaire/Dashboard}"><i class="fas fa-tachometer-alt"></i> لوحة التحكم</a></li>
                    <li><a th:href="@{/Secretaire/notifications}"><i class="fas fa-bell"></i> الإشعارات
                        <span th:if="${unreadNotificationsCount > 0}" class="badge bg-danger" th:text="${unreadNotificationsCount}"></span>
                    </a></li>
                    <li><a th:href="@{/Secretaire/rdv/list}"><i class="fas fa-calendar-alt"></i> المواعيد</a></li>
                    <li><a th:href="@{/Secretaire/dossier/list}"><i class="fas fa-folder"></i> الملفات</a></li>
                    <li><a th:href="@{/logout}"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</a></li>
                </ul>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-lg-10">
            <div class="main-content">
                <h2 class="page-title">الإشعارات</h2>

                <div class="notifications-container">
                    <div class="notifications-header">
                        <h5>قائمة الإشعارات</h5>
                        <a th:href="@{/Secretaire/notifications/mark-all-read}" class="btn-mark-all-read">
                            <i class="fas fa-check-double ml-1"></i>
                            تحديد الكل كمقروء
                        </a>
                    </div>

                    <div th:if="${notifications.isEmpty()}" class="empty-state">
                        <i class="fas fa-bell-slash"></i>
                        <h5>لا توجد إشعارات</h5>
                        <p>ستظهر الإشعارات الجديدة هنا عند استلامها.</p>
                    </div>

                    <div th:unless="${notifications.isEmpty()}" class="notification-list">
                        <div th:each="notification : ${notifications}" class="notification-item"
                             th:classappend="${notification.lu ? 'read' : 'unread'}">
                            <!-- Afficher les informations de la notification -->
                            <div class="notification-content" onclick="window.location.href=this.getAttribute('data-href')"
                                 th:attr="data-href=@{/Secretaire/notifications/{id}(id=${notification.id})}">
                                <div class="notification-header">
                                    <span class="notification-title" th:text="${notification.titre}"></span>
                                    <span class="notification-date" th:text="${#temporals.format(notification.dateCreation, 'dd/MM/yyyy HH:mm')}"></span>
                                </div>
                                <div class="notification-message" th:text="${notification.message}"></div>
                            </div>

                            <!-- Ajout des boutons pour les notifications de type RDV -->
                            <div class="rdv-actions" th:if="${notification.type != null && notification.type.startsWith('RDV_')}">
                                <!-- Bouton de détails toujours affiché -->
                                <form th:action="@{/Secretaire/notifications/{id}(id=${notification.id})}" method="get">
                                    <button type="submit" class="btn-action btn-details">
                                        <i class="fas fa-eye ml-1"></i> عرض التفاصيل
                                    </button>
                                </form>

                                <!-- Boutons accepter/refuser si rendezVous n'est pas null -->
                                <form th:if="${notification.rendezVous != null && notification.rendezVous.id != null}"
                                      th:action="@{/Secretaire/rdv/accepter/{id}(id=${notification.getRendezVous().getId()})}" method="post">
                                    <button type="submit" class="btn-action btn-accept">
                                        <i class="fas fa-check ml-1"></i> قبول
                                    </button>
                                </form>
                                <form th:if="${notification.rendezVous != null && notification.rendezVous.id != null}"
                                      th:action="@{/Secretaire/rdv/refuser/{id}(id=${notification.rendezVous.id})}" method="post">
                                    <button type="submit" class="btn-action btn-reject">
                                        <i class="fas fa-times ml-1"></i> رفض
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js"></script>

<script>
    $(document).ready(function() {
        // Ajouter une classe active au menu actuel
        const currentLocation = window.location.pathname;
        $('.sidebar ul li').each(function() {
            const link = $(this).find('a').attr('href');
            if (currentLocation.includes(link) && link !== '#') {
                $(this).addClass('active');
                $(this).siblings().removeClass('active');
            }
        });
    });
</script>
</body>
</html>
